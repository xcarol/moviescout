name: Android Release Build & Publish

on:
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-android:
    name: Build & Deploy Signed Android AppBundle
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1. Obtenir el codi font
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar l'entorn de Java (requerit per a Gradle/Android)
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Flutter amb memòria cau activada per accelerar builds
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Instal·lar dependències del projecte
      - name: Install dependencies
        run: flutter pub get

      # 5. Descodificar el Keystore des del secret Base64
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 6. Generar el fitxer key.properties temporal per al procés de compilació
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # 7. Compilar l'Android App Bundle (.aab) en Release
      - name: Build Android AppBundle
        run: flutter build appbundle --release

      # 8. Pujar el .aab com a artefacte del Workflow (per poder-lo descarregar manualment si cal)
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # 9. Publicar automàticament a Google Play Console (Internal Testing)
      - name: Deploy to Google Play Internal Testing
        uses: r2studio/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.xicra.moviescout
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
