name: Android Release Build & Publish

on:
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-android:
    name: Build & Deploy Signed Android AppBundle
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java (required for Gradle/Android) and Flutter environment
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Create configuration files from GitHub secrets
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # 4. Install project dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Build Android App Bundle (.aab) in release mode
      - name: Build Android AppBundle
        run: flutter build appbundle --release

      # 6. Upload the .aab as a workflow artifact (to allow manual download if needed)
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          
      # 7. Automatically publish to Google Play Console (Internal Testing)
      - name: Deploy to Google Play Internal Testing
        uses: KevinRohn/github-action-upload-play-store@v1.0.2
        with:
          service_account_json: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          package_name: com.xicra.moviescout
          aab_file_path: build/app/outputs/bundle/release/app-release.aab
          track: internal
          release_status: completed
